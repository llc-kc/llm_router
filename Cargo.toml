[package]
name = "llm_cahr"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6", features = ["macros", "ws", "tracing"] }
reqwest = { version = "0.12.8", features = ["stream", "blocking", "json", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.9.2"
openai-protocol = "1.4.1"
futures-util = "0.3"
tokio-stream = "0.1"
bytes = "1.8.0"
llm-tokenizer = "1.3.0"
dashmap = "6.1.0"
sha2 = "0.10"  # SHA256哈希算法
hex = "0.4"    # 十六进制字符串与字节的互转
thiserror = "1"
url = "2"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "llm_cahr"
path = "src/main.rs"

[[bin]]
name = "mooncake-http-client"
path = "src/bin/mooncake_http_client.rs"